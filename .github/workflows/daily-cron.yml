name: Daily content automation

# Netlify has no equivalent of vercel.json's `crons` block (it only reads
# that config on Vercel) — so /api/cron/generate-horoscopes and
# /api/cron/prefill-panchang, despite both being written to support "any
# external scheduler" (see their own route.ts comments), were never
# actually being triggered on the live Netlify deployment. Found live:
# HoroscopeContent had nothing published past 2026-09-01 despite the app
# running fine otherwise. GitHub Actions' own cron scheduler covers the
# gap for free, from the same repo, with no new external service to sign
# up for. Schedule times match vercel.json's UTC times exactly, so both
# configs stay meaningful if this project ever moves back to Vercel.
on:
  schedule:
    - cron: "0 0 * * *"   # prefill-panchang, 00:00 UTC
    - cron: "30 0 * * *"  # generate-horoscopes, 00:30 UTC
  workflow_dispatch: {} # manual "Run workflow" button, for backfills/testing

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Determine which job this run is for
        id: which
        run: |
          # workflow_dispatch has no cron schedule, so run both in that case.
          if [ "${{ github.event.schedule }}" = "30 0 * * *" ]; then
            echo "horoscopes=true" >> "$GITHUB_OUTPUT"
            echo "panchang=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 0 * * *" ]; then
            echo "horoscopes=false" >> "$GITHUB_OUTPUT"
            echo "panchang=true" >> "$GITHUB_OUTPUT"
          else
            echo "horoscopes=true" >> "$GITHUB_OUTPUT"
            echo "panchang=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate daily horoscopes
        if: steps.which.outputs.horoscopes == 'true'
        # One request per locale, not one request for all 3 — found live
        # that a single all-locales call (up to 36 AI generations) reliably
        # 502'd from Netlify's function timeout, which is exactly what was
        # showing up as this job's daily failure email. Each locale is now a
        # third of the work, and idempotent (already-generated signs are
        # skipped instantly), so a retry after a timeout is cheap and only
        # redoes whatever didn't finish. The job only actually fails (and
        # emails) if one locale still can't get through after 3 tries.
        run: |
          for locale in en hi gu; do
            echo "== horoscopes: $locale =="
            success=false
            for attempt in 1 2 3; do
              if curl -sS -f -X GET "${{ vars.APP_URL }}/api/cron/generate-horoscopes?locale=$locale" \
                   -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"; then
                success=true
                break
              fi
              echo "attempt $attempt for locale=$locale failed, retrying in 10s..."
              sleep 10
            done
            if [ "$success" != "true" ]; then
              echo "::error::horoscope generation failed for locale=$locale after 3 attempts"
              exit 1
            fi
          done

      - name: Prefill panchang cache
        if: steps.which.outputs.panchang == 'true'
        run: |
          curl -sS -f -X GET "${{ vars.APP_URL }}/api/cron/prefill-panchang" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
