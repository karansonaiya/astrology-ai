name: Daily content automation

# Netlify has no equivalent of vercel.json's `crons` block (it only reads
# that config on Vercel) — so /api/cron/generate-horoscopes and
# /api/cron/prefill-panchang, despite both being written to support "any
# external scheduler" (see their own route.ts comments), were never
# actually being triggered on the live Netlify deployment. Found live:
# HoroscopeContent had nothing published past 2026-09-01 despite the app
# running fine otherwise. GitHub Actions' own cron scheduler covers the
# gap for free, from the same repo, with no new external service to sign
# up for. Schedule times match vercel.json's UTC times exactly, so both
# configs stay meaningful if this project ever moves back to Vercel.
#
# Found live, a second time: after this workflow had been running for a
# few days, HoroscopeContent rows for 2026-09-07/08 turned out to have
# been created by GitHub's schedule trigger, but 5-7 hours late (07:24 UTC
# and 05:12 UTC respectively, not the configured 00:30 UTC) — and on
# 2026-09-09 it still hadn't fired by 09:13 UTC (8.5+ hours late), forcing
# a manual "Generate all 12 signs" click in the admin panel instead.
# GitHub's own docs confirm `schedule` is best-effort with no fixed SLA,
# and low-activity repos get deprioritized further. Since
# generate-horoscopes is already idempotent (existing sign/locale/period
# rows are skipped instantly, not re-created), the fix is redundancy, not
# a smarter scheduler: fire it every 2 hours through the IST morning
# instead of once. A successful run makes every later retry that day a
# handful of instant no-op skip-checks — cheap insurance against any one
# firing being dropped or delayed past when users start checking.
# PAUSED 2026-09-15, then RE-ENABLED the same day once the real cause was
# fixed: daily runs were failing (emailing a failure notice every day) and
# burning real AI-provider quota on every attempt with nothing to show for
# it — see the "Generate daily horoscopes" step below for the actual root
# cause (a free-tier AI rate limit colliding with Netlify's 10s function
# timeout) and the fix (one small request per sign instead of 12 at once).
on:
  schedule:
    - cron: "0 0 * * *"    # prefill-panchang, 00:00 UTC (once — not seen to have this problem)
    - cron: "30 0 * * *"   # generate-horoscopes — primary attempt, 00:30 UTC (06:00 IST)
    - cron: "0 1 * * *"    # send-daily-reminder push, 01:00 UTC (06:30 IST) — after the primary attempt above has had time to finish
    - cron: "30 2 * * *"   # generate-horoscopes — retry, 02:30 UTC (08:00 IST)
    - cron: "30 4 * * *"   # generate-horoscopes — retry, 04:30 UTC (10:00 IST)
    - cron: "30 6 * * *"   # generate-horoscopes — retry, 06:30 UTC (12:00 IST)
    - cron: "30 8 * * *"   # generate-horoscopes — retry, 08:30 UTC (14:00 IST)
    - cron: "30 10 * * *"  # generate-horoscopes — retry, 10:30 UTC (16:00 IST)
  workflow_dispatch: {} # manual "Run workflow" button, for backfills/testing

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Determine which job this run is for
        id: which
        run: |
          # Exactly one schedule string each for panchang and the reminder
          # push — every other schedule string is a generate-horoscopes
          # attempt (primary or one of the retries above), so that one is
          # matched by exclusion rather than listing every retry time here
          # too. workflow_dispatch has no schedule string at all, so run
          # everything in that case (manual backfill/testing).
          if [ "${{ github.event.schedule }}" = "0 0 * * *" ]; then
            echo "horoscopes=false" >> "$GITHUB_OUTPUT"
            echo "panchang=true" >> "$GITHUB_OUTPUT"
            echo "reminder=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 1 * * *" ]; then
            echo "horoscopes=false" >> "$GITHUB_OUTPUT"
            echo "panchang=false" >> "$GITHUB_OUTPUT"
            echo "reminder=true" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.schedule }}" ]; then
            echo "horoscopes=true" >> "$GITHUB_OUTPUT"
            echo "panchang=false" >> "$GITHUB_OUTPUT"
            echo "reminder=false" >> "$GITHUB_OUTPUT"
          else
            echo "horoscopes=true" >> "$GITHUB_OUTPUT"
            echo "panchang=true" >> "$GITHUB_OUTPUT"
            echo "reminder=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate daily horoscopes
        if: steps.which.outputs.horoscopes == 'true'
        # One request per (locale, sign) pair now — not one per locale.
        # Found live 2026-09-15: even one locale's 12 signs in a single
        # request could trip the AI provider's free-tier per-minute rate
        # limit (the account is staying on the free tier, not upgrading),
        # and every rate-limited call fell through the whole model fallback
        # chain, slowing the request down enough to 502 on Netlify's function
        # timeout (a hard 10s on the free/personal plan — confirmed against
        # Netlify's own docs). There's no way to pace 12 AI calls safely
        # under a per-minute limit AND finish inside a 10-second function
        # window at the same time, so the pacing has to happen out here
        # instead: 36 small, fast requests (each well under the 10s wall on
        # its own), spaced out for real by the `sleep 5` below. Still
        # idempotent either way — already-generated signs are skipped
        # instantly, so a retry after any failure is cheap.
        run: |
          for locale in en hi gu; do
            for sign in aries taurus gemini cancer leo virgo libra scorpio sagittarius capricorn aquarius pisces; do
              echo "== horoscopes: locale=$locale sign=$sign =="
              success=false
              for attempt in 1 2 3; do
                if curl -sS -f -X GET "${{ vars.APP_URL }}/api/cron/generate-horoscopes?locale=$locale&sign=$sign" \
                     -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"; then
                  success=true
                  break
                fi
                echo "attempt $attempt for locale=$locale sign=$sign failed, retrying in 10s..."
                sleep 10
              done
              if [ "$success" != "true" ]; then
                echo "::error::horoscope generation failed for locale=$locale sign=$sign after 3 attempts"
                exit 1
              fi
              sleep 5 # pace requests well under the AI provider's free-tier per-minute rate limit
            done
          done

      - name: Prefill panchang cache
        if: steps.which.outputs.panchang == 'true'
        run: |
          curl -sS -f -X GET "${{ vars.APP_URL }}/api/cron/prefill-panchang" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Send daily reminder push
        if: steps.which.outputs.reminder == 'true'
        # Best-effort, not `-f` — a subscriber base of zero (push not
        # configured yet, or nobody's opted in) still returns 200 with
        # {sent: 0}, so this only fails on a genuine server error, and even
        # then a missed reminder once isn't worth failing the whole workflow
        # run over (unlike horoscope generation, there's no content-gap risk).
        run: |
          curl -sS -X GET "${{ vars.APP_URL }}/api/cron/send-daily-reminder" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" || true
